<text x="486.0" y="182.0" font-size="11" fill="#1a7f37" text-anchor="start">the PIC sees, so  inverted: false</text>
<line x1="620.0" y1="190.0" x2="620.0" y2="204.0" stroke="#1a7f37" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="34.0" y="498.0" font-size="12" fill="#1f2328" text-anchor="start">No opto-coupler and no 12 V rail needed: the stage runs entirely off the ESP’s own 3.3 V, and the bus only ever drives a base.</text>
<text x="34.0" y="520.0" font-size="12" fill="#57606a" text-anchor="start">The grounds are shared, which the original does too. Keep the ESP on its own supply so it outlives a cut to the lock.</text>
