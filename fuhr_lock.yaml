# Example ESPHome configuration for the Fuhr multitronic lock bus.
#
# Wiring and protocol documentation: see README.md. The bus runs at the lock's
# supply voltage, so it must go through a level shifter or opto-coupler - do
# not connect it straight to a GPIO.
#
# This example uses the components/ directory from this repository. To pull it
# straight from GitHub instead, replace the external_components block with:
#
#   external_components:
#     - source: github://arnemauer/esphome-fuhr-multitronic
#       components: [fuhr_multitronic]

esphome:
  name: fuhr-lock
  friendly_name: Front door lock

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
ota:
  - platform: esphome

web_server:
    port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [fuhr_multitronic]

fuhr_multitronic:
  id: lock_bus
  bus_pin:
    number: GPIO16
    mode:
      input: true
    # The transistor stage in docs/wiring.svg already inverts, so the GPIO
    # sees what the controller's PIC sees: idle low, start bit high. That is
    # what the component expects natively, hence false.
    inverted: false
  # ctrl_pin is deliberately absent. The controller's transmit signal only
  # exists inside the controller, not at a terminal, and direction is
  # recovered from the message code anyway.
  baud_rate: 2000
  # Three missed keep-alives. See "Supervision" in README.md - and note
  # that Home Assistant must also alarm on the entity going unavailable,
  # because a dead ESP cannot report its own death.
  timeout: 45s

  on_message:
    - lambda: |-
        ESP_LOGI("lock", "%s 0x%02X %s", from_controller ? "CTRL" : "LOCK", code, name.c_str());

text_sensor:
  - platform: fuhr_multitronic
    fuhr_multitronic_id: lock_bus
    message:
      name: "Lock last message"
      id: lock_message
    door:
      name: "Door status"
      id: door_status
    lock:
      name: "Lock status"
      id: lock_status
    day_latch:
      name: "Day latch function"
      id: day_latch_status

binary_sensor:
  - platform: fuhr_multitronic
    fuhr_multitronic_id: lock_bus
    connected:
      name: "Lock connection"
      id: lock_connection
      on_release:
        - logger.log:
            level: WARN
            format: "No status from the lock for 45 s"
    fault:
      name: "Lock fault"
    tamper:
      name: "Lock tamper alarm"

  # Door and lock are the two states the component reports as text but that
  # Home Assistant prefers as binary with a device class, so mirror them.
  # Fault and tamper are already binary above.
  - platform: template
    name: "Door"
    device_class: door
    lambda: |-
      auto s = id(door_status).state;
      if (s == "Open") return true;
      if (s == "Closed") return false;
      return {};

  - platform: template
    name: "Unlocked"
    device_class: lock   # on = unlocked
    lambda: |-
      auto s = id(lock_status).state;
      if (s == "Locked") return false;
      if (s == "Unknown") return {};
      return true;

