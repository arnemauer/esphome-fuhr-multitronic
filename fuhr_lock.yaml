# Example ESPHome configuration for the Fuhr multitronic lock bus.
#
# Wiring and protocol documentation: see README.md. The bus runs at the lock's
# supply voltage, so it must go through a level shifter or opto-coupler - do
# not connect it straight to a GPIO.
#
# This example uses the components/ directory from this repository. To pull it
# straight from GitHub instead, replace the external_components block with:
#
#   external_components:
#     - source: github://arnemauer/esphome-fuhr-multitronic
#       components: [fuhr_multitronic]

esphome:
  name: fuhr-lock
  friendly_name: Front door lock

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
ota:
  - platform: esphome

web_server:
    port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [fuhr_multitronic]

fuhr_multitronic:
  id: lock_bus
  bus_pin:
    number: GPIO16
    mode:
      input: true
    # Set inverted: true if your level shifter inverts the signal. The bus
    # must idle low at the GPIO and go high for the start bit.
    inverted: false
  # Optional. Wired to the line that is asserted while the controller talks.
  # Leave it out and the direction is derived from the message code instead.
  ctrl_pin:
    number: GPIO17
    mode:
      input: true
  baud_rate: 2000
  timeout: 30s

  on_message:
    - lambda: |-
        ESP_LOGI("lock", "%s 0x%02X %s", from_controller ? "CTRL" : "LOCK", code, name.c_str());

text_sensor:
  - platform: fuhr_multitronic
    fuhr_multitronic_id: lock_bus
    message:
      name: "Lock last message"
      id: lock_message
    door:
      name: "Door status"
      id: door_status
    lock:
      name: "Lock status"
      id: lock_status
    day_mode:
      name: "Day mode"
      id: day_mode_status
    error:
      name: "Lock fault"
      id: lock_fault

binary_sensor:
  - platform: fuhr_multitronic
    fuhr_multitronic_id: lock_bus
    connected:
      name: "Lock connection"

  # Home Assistant works better with proper device classes for the two
  # genuinely binary states, so mirror them:
  - platform: template
    name: "Door"
    device_class: door
    lambda: |-
      auto s = id(door_status).state;
      if (s == "Open") return true;
      if (s == "Closed") return false;
      return {};

  - platform: template
    name: "Lock"
    device_class: lock   # on = unlocked
    lambda: |-
      auto s = id(lock_status).state;
      if (s == "Locked") return false;
      if (s == "Unknown") return {};
      return true;

  - platform: template
    name: "Lock problem"
    device_class: problem
    lambda: |-
      auto s = id(lock_fault).state;
      if (s == "Unknown") return {};
      return s != "None";
